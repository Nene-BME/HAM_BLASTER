<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ยืนยันคำสั่งซื้อ | Ham Blaster</title>
  <meta name="description" content="กรอกข้อมูลเพื่อยืนยันคำสั่งซื้อปืนของเล่น Ham Blaster" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container" style="display:flex; align-items:center; justify-content:space-between; width:100%;">
      <a href="index.html" class="navbar__logo">Ham<span>Blaster</span></a>
      <nav class="navbar__links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
      </nav>
    </div>
  </header>

  <!-- Order form -->
  <section class="section">
    <div class="container">
      <div class="text-center hb-max-w page-heading">
        <h1>ยืนยันคำสั่งซื้อ</h1>
        <p>กรอกข้อมูลให้ครบ แล้วทีมงานจะติดต่อกลับเพื่อยืนยันการจัดส่ง</p>
      </div>

      <form id="orderFrom" class="card form-card">
        <div class="form-group">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" placeholder="ชื่อ-นามสกุล" required />
        </div>

        <div class="form-group">
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" placeholder="เบอร์โทรศัพท์ หรือ Line ID" required />
        </div>

        <div class="form-group">
          <label for="items">รายการสินค้า</label>
          <input type="text" id="items" name="items" readonly />
          <span class="hint">ระบบเติมให้อัตโนมัติจากสินค้าที่เลือก</span>
        </div>

        <div class="form-group">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="text" id="total" name="total" readonly />
          <span class="hint">ระบบเติมให้อัตโนมัติ ไม่ต้องกรอกเอง</span>
        </div>

        <div class="form-group">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note" placeholder="เช่น สีที่ต้องการ, ที่อยู่จัดส่ง, ช่วงเวลาที่สะดวกให้ติดต่อกลับ"></textarea>
        </div>

        <button type="submit" class="btn btn--green btn--block">ยืนยันสั่งซื้อ</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container text-center">
      <p style="color: rgba(255,255,255,0.7); margin-bottom: 0;">
        © 2026 Ham Blaster — ปืนของเล่นเพื่อความสนุก โปรดเล่นอย่างปลอดภัยและอยู่ในสายตาผู้ใหญ่
      </p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
